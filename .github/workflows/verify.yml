name: Verify science and interfaces

on:
  push:
    branches: [main, master, 'improve/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python and Tk contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Static compile
        run: python -m compileall -q package workbench tests
      - name: Linux tests with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable (not an installation acceptance test)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean mass_finding.spec
      - name: Preserve Windows build for manual acceptance
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-MassFinding-build
          path: dist/MassFinding.exe
          retention-days: 7

  browser:
    name: Real Chrome workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Chinese glyph coverage for screenshot verification
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match ':lang=zh-cn'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start loopback workbench
        run: |
          python -m workbench.server > /tmp/mass-finding-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8866/api/config', timeout=1).read()
                  break
              except OSError:
                  time.sleep(.25)
          else:
              raise RuntimeError('Local workbench did not start')
          PY
      - name: Verify browser flows with sandbox enabled
        run: npm run test:browser
      - name: Preserve screenshots and flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chrome-workbench-evidence
          path: test-results/
          retention-days: 7
